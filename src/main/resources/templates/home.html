<!doctype html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gestão de Recursos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg bg-primary" data-bs-theme="dark">
  <div class="container">
    <a class="navbar-brand" th:href="@{/home}">
      <img src="https://flaticons.net/icon.php?slug_category=people&slug_icon=user-group" alt="Logo" width="30" height="24" class="d-inline-block align-text-top mt-1 me-1"> Gestão de Recursos
    </a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal" aria-controls="menuPrincipal" aria-expanded="false" aria-label="Abrir menu">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="menuPrincipal">
      <ul class="navbar-nav ms-auto nav-underline">
        <li class="nav-item">
          <a class="nav-link active text-light-emphasis" aria-current="page" th:href="@{/home}">Início</a>
        </li>
        <li class="nav-item">
          <a class="nav-link text-light-emphasis" th:href="@{/colaboradorlista}">Colaboradores</a>
        </li>

         <li class="nav-item">
          <a class="nav-link text-light-emphasis" th:href="@{/recursolista}">Recursos</a>
        </li>
        <li class="nav-item">
          <a class="nav-link text-light-emphasis" th:href="@{/reservalista}">Reservas</a>
        </li>
        <li class="nav-item">
          <a class="nav-link text-light-emphasis" th:href="@{/localizacaolista}">Localização de Recursos</a>
        </li>
        <li class="nav-item">
          <a class="nav-link text-light-emphasis" th:href="@{/login}">Sair</a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<main class="container py-5">
  <div class="p-5 mt-5 mb-4 bg-light rounded-4">
    <div class="container-fluid py-3">
      <div class="row align-items-center">

        <div class="col-md-8">
          <h2 class="mb-4">O que deseja fazer hoje?</h2>

          <div class="d-flex gap-2 flex-wrap">
            <a class="btn btn-primary btn-lg" th:href="@{/colaboradorlista}">Acessar colaboradores</a>
            <a class="btn btn-primary btn-lg" th:href="@{/recursolista}">Acessar recursos</a>
            <a class="btn btn-primary btn-lg" th:href="@{/reservalista}">Acessar reservas</a>
          </div>
        </div>

        <div class="col-md-4 text-center">
          <img th:src="@{/images/pfp.png}"
               alt="PFP"
               class="img-fluid"
               style="max-width: 169px;"
               title="Este é você">
          <h2 class="text" th:text="${nomeColaborador}">nomeColaborador</h2>
        </div>

      </div>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

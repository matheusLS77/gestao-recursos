<!doctype html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gestão de Recursos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
  <link rel="shortcut icon" href="/images/favicon.ico" type="image/x-icon">
</head>
<body>
<nav class="navbar navbar-expand-lg bg-primary" data-bs-theme="dark">
  <div class="container">
    <a class="navbar-brand" th:href="@{/home}">
      <img src="/images/icone-radar.png" alt="Logo" class="d-inline-block align-text-top mt-1 me-1 icone-logo"> Gestão de Recursos
    </a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal" aria-controls="menuPrincipal" aria-expanded="false" aria-label="Abrir menu">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="menuPrincipal">
      <ul class="navbar-nav ms-auto nav-underline">
        <li class="nav-item">
          <a class="nav-link active text-light-emphasis" aria-current="page" th:href="@{/home}">Início</a>
        </li>
        <li class="nav-item">
          <a class="nav-link text-light-emphasis" th:href="@{/colaboradorlista}">Colaboradores</a>
        </li>

         <li class="nav-item">
          <a class="nav-link text-light-emphasis" th:href="@{/recursolista}">Recursos</a>
        </li>
        <li class="nav-item">
          <a class="nav-link text-light-emphasis" th:href="@{/reservalista}">Reservas</a>
        </li>
        <li class="nav-item">
          <a class="nav-link text-light-emphasis" th:href="@{/localizacaolista}">Localização de Recursos</a>
        </li>
        <li class="nav-item">
          <a class="nav-link text-light-emphasis" th:href="@{/login}">Sair</a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<main class="container py-5">
  <div class="p-4 mt-4 mb-4 bg-light rounded-4 shadow-sm">
    <div class="container-fluid py-3">
      <div class="row align-items-center">

        <div class="col-md-8">
          <h2 class="mb-4">O que deseja fazer hoje?</h2>

          <div class="d-flex gap-2 flex-wrap mt-3">
            <a class="btn btn-primary" th:href="@{/colaboradorlista}"> <img class="icone-btn" th:src="@{/images/icone-usuarios.png}" alt="icone-colaborador"> Colaboradores</a>
            <a class="btn btn-primary" th:href="@{/recursolista}"> <img class="icone-btn" th:src="@{/images/icone-recurso.png}" alt="icone-recurso"> Recursos</a>
            <a class="btn btn-primary" th:href="@{/reservalista}"> <img class="icone-btn" th:src="@{/images/icone-reserva.png}" alt="icone-reserva" style="width: 20px;height: 20px;"> Reservas</a>
            <a class="btn btn-primary" th:href="@{/localizacaolista}"> <img class="icone-btn" th:src="@{/images/icone-local.png}" alt="icone-localização">Localizações</a>
          </div>
        </div>

        <div class="col-md-4 text-center">
          <img th:src="@{/images/pfp.png}" alt="PFP" class="img-fluid" style="max-width: 169px;" title="Este é você">
          <h2 th:text="${nomeColaborador}">nomeColaborador</h2>
        </div>

      </div>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

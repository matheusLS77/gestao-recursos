<!doctype html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-light">

<div class="container-fluid min-vh-100">
  <div class="row min-vh-100">

    <!-- Lado esquerdo verde -->
    <div class="col-lg-6 d-none d-lg-flex align-items-center justify-content-center bg-primary"></div>

    <!-- Lado direito login -->
    <div class="col-12 col-lg-5 d-flex align-items-center justify-content-center p-4">

      <div class="card w-100 border-0 outline-0" style="max-width: 450px;">
        <div class="card-body rounded-5 p-4 border-0">

          <h1 class="h4 text-center mb-5 mt-3">Gestão de Recursos</h1>
          <div class="alert alert-danger" role="alert" th:if="${erro}" th:text="${erro}">E-mail ou senha inválidos.</div>

          <form th:action="@{/login}" method="post">

            <div class="form-floating mb-3">
              <input type="email" class="form-control" id="email" name="email" th:value="${email}" placeholder=" " required>
              <label for="email"><img th:src="@{/images/icone-usuario.png}" class="label-icon" alt="Ícone de usuário"/> E-mail</label>
            </div>

            <div class="form-floating mb-3">
              <input type="password" class="form-control mb-2" id="senha" name="senha" placeholder=" " required>
              <label for="senha"><img th:src="@{/images/icone-de-cadeado.png}" class="label-icon" alt="Ícone de senha"/> Senha</label>
            </div>

            <button type="submit" class="btn btn-primary w-100 mt-5 mb-3">Entrar</button>

          </form>

        </div>
      </div>

    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

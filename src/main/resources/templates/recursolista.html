<!doctype html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lista de usuarios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg bg-primary" data-bs-theme="dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/home}">
            <img src="https://flaticons.net/icon.php?slug_category=people&slug_icon=user-group" alt="Logo" width="30" height="24" class="d-inline-block align-text-top mt-1 me-1"> Menu
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal" aria-controls="menuPrincipal" aria-expanded="false" aria-label="Abrir menu">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="menuPrincipal">
            <ul class="navbar-nav ms-auto nav-underline">
                <li class="nav-item">
                    <a class="nav-link text-light-emphasis" aria-current="page" th:href="@{/home}">Início</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-light-emphasis" th:href="@{/colaboradorlista}">Colaboradores</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-light-emphasis" th:href="@{/recursolista}">Equipamentos</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-light-emphasis" th:href="@{/login}">Sair</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<main class="container py-4">
    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4">
        <div>
            <h1 class="h3 mb-1">Recursos</h1>
            <p class="text-secondary mb-0">Lista de recursos cadastrados no sistema.</p>
        </div>

        <a class="btn btn-primary" th:href="@{/recursocadastrar}">Novo recurso</a>
    </div>

    <div class="alert alert-success" role="alert" th:if="${mensagem}" th:text="${mensagem}">
        Recurso salvo com sucesso.
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-striped align-middle mb-0">
                    <thead class="table-primary">
                    <tr>
                        <th>ID</th>
                        <th>Descrição</th>
                        <th>Tipo</th>
                        <th>Dias disponíveis</th>
                        <th>Data inicial</th>
                        <th>Data final</th>
                        <th>Hora inicial</th>
                        <th>Hora final</th>
                        <th class="text-end">Ações</th>
                    </tr>
                    </thead>

                    <tbody>

                    <tr th:each="recurso : ${recursos}">
                        <td th:text="${recurso.id}"></td>
                        <td th:text="${recurso.descricao}"></td>
                        <td th:text="${recurso.tipo}"></td>

                        <td>
                <span th:each="dia, stat : ${recurso.diasDaSemanaDisponivel}">
                    <span th:text="${dia}"></span><span th:if="${!stat.last}">, </span>
                </span>
                        </td>

                        <td th:text="${recurso.dataInicialAgendamento}"></td>
                        <td th:text="${recurso.dataFinalAgendamento}"></td>
                        <td th:text="${recurso.horaInicialAgendamento}"></td>
                        <td th:text="${recurso.horaFinalAgendamento}"></td>

                        <td class="text-end">
                            <a class="btn btn-sm btn-outline-primary me-1"
                               th:href="@{/recursoatualizar/{id}(id=${recurso.id})}">
                                Editar
                            </a>

                            <button class="btn btn-sm btn-outline-danger excluir"
                                    th:data-id="${recurso.id}">
                                Excluir
                            </button>
                        </td>
                    </tr>

                    <tr th:if="${#lists.isEmpty(recursos)}">
                        <td colspan="9" class="text-center text-secondary py-4">
                            Nenhum recurso cadastrado.
                        </td>
                    </tr>

                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<script src="/excluir_colaborador.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

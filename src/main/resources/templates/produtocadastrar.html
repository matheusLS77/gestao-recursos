<!doctype html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lista de produtos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg bg-primary" data-bs-theme="dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/home}">
            <img src="https://flaticons.net/icon.php?slug_category=people&slug_icon=user-group" alt="Logo" width="30" height="24" class="d-inline-block align-text-top mt-1 me-1"> Menu
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal" aria-controls="menuPrincipal" aria-expanded="false" aria-label="Abrir menu">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="menuPrincipal">
            <ul class="navbar-nav ms-auto nav-underline">
                <li class="nav-item">
                    <a class="nav-link text-light-emphasis" aria-current="page" th:href="@{/home}">Início</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-light-emphasis" th:href="@{/colaboradorlista}">Colaboradores</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-light-emphasis" th:href="@{/login}">Sair</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<main class="container py-4">
    <div class="row justify-content-center">
        <div class="col-12 col-lg-8">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h1 class="h3 mb-1">Cadastrar produto</h1>
                    <p class="text-secondary mb-0">Preencha os dados para cadastrar um novo produto.</p>
                </div>
            </div>

            <div class="card shadow-sm">
                <div class="card-body">
                    <form th:action="@{/produtos}" th:object="${produto}" method="post">
                        <div class="mb-3">
                            <label for="descricao" class="form-label">Descrição</label>
                            <input type="text" class="form-control" id="descricao" th:field="*{descricao}" placeholder="Digite a descrição" required>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('descricao')}" th:errors="*{descricao}">
                                Erro na descrição
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="tipo" class="form-label">Tipo</label>
                            <input type="text" class="form-control" id="tipo" th:field="*{tipo}" placeholder="Digite o tipo" required>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('tipo')}" th:errors="*{tipo}">
                                Erro no tipo
                            </div>
                        </div>


                        <div class="mb-3">
                            <label for="dataInicial" class="form-label">Data Inicial</label>
                            <input type="date" class="form-control" id="dataInicial" th:field="*{dataInicial}">
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('dataInicial')}" th:errors="*{dataInicial}">
                                Erro na data inicial
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="dataFinal" class="form-label">Data Final</label>
                            <input type="date" class="form-control" id="dataFinal" th:field="*{dataFinal}">
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('dataFinal')}" th:errors="*{dataFinal}">
                                Erro na data final
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="horarioInicial" class="form-label">Horário Inicial</label>
                            <input type="time" class="form-control" id="horarioInicial" th:field="*{horarioInicial}">
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('horarioInicial')}" th:errors="*{horarioInicial}">
                                Erro no horário inicial
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="horarioFinal" class="form-label">Horário Final</label>
                            <input type="time" class="form-control" id="horarioFinal" th:field="*{horarioFinal}">
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('horarioFinal')}" th:errors="*{horarioFinal}">
                                Erro no horário final
                            </div>
                        </div>
                        <div class="d-flex justify-content-end gap-2">
                            <a class="btn btn-outline-secondary" th:href="@{/produtolista}">Cancelar</a>
                            <button type="submit" class="btn btn-primary">Salvar</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!doctype html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cancelamento de Reserva</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
    <link rel="shortcut icon" href="/images/favicon.ico" type="image/x-icon">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg bg-primary" data-bs-theme="dark">
  <div class="container">
    <a class="navbar-brand" th:href="@{/home}">
      <img src="/images/icone-radar.png" alt="Logo" class="d-inline-block align-text-top mt-1 me-1 icone-logo"> Gestão de Recursos
    </a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal" aria-controls="menuPrincipal" aria-expanded="false" aria-label="Abrir menu">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="menuPrincipal">
      <ul class="navbar-nav ms-auto nav-underline">
        <li class="nav-item">
          <a class="nav-link text-light-emphasis" aria-current="page" th:href="@{/home}">Início</a>
        </li>
        <li class="nav-item">
          <a class="nav-link text-light-emphasis" th:href="@{/colaboradorlista}">Colaboradores</a>
        </li>
        <li class="nav-item">
          <a class="nav-link text-light-emphasis" th:href="@{/recursolista}">Recursos</a>
        </li>
        <li class="nav-item">
          <a class="nav-link active text-light-emphasis" th:href="@{/reservalista}">Reservas</a>
        </li>
        <li class="nav-item">
          <a class="nav-link text-light-emphasis" th:href="@{/localizacaolista}">Localização de Recursos</a>
        </li>
        <li class="nav-item">
          <a class="nav-link text-light-emphasis" th:href="@{/login}">Sair</a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<main class="container py-4">
  <div class="row justify-content-center">
    <div class="col-12 col-lg-8">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
          <h1 class="h3 mb-1">Cancelar reserva</h1>
          <p class="text-secondary mb-0">Preencha o motivo para cancelar a reserva.</p>
        </div>
      </div>

      <div class="card shadow-sm border-0 outline-0">
        <div class="card-body">
          <div class="alert alert-danger" th:if="${erro}" th:text="${erro}"></div>
          <form th:action="@{/reservacancelar}" th:object="${reserva}" method="post">
            <input type="hidden" th:field="*{id}">

            <div class="mb-3">
              <label class="form-label fw-medium">Motivo Cancelamento</label>
              <input type="text" class="form-control" th:field="*{motivoCancelamento}" required>

              <div class="text-danger small mt-1" th:if="${#fields.hasErrors('motivoCancelamento')}" th:errors="*{motivoCancelamento}"></div>
            </div>

            <div class="d-flex justify-content-end gap-2">
              <a class="btn btn-outline-secondary" th:href="@{/reservalista}">Voltar</a>
              <button type="submit" class="btn btn-danger">Cancelar</button>
            </div>

          </form>
        </div>
      </div>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

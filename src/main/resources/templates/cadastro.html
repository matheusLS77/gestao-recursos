<!doctype html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Criar Conta</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
  <link rel="shortcut icon" href="/images/favicon.ico" type="image/x-icon">
</head>

<body class="bg-light">

<div class="container-fluid min-vh-100">
  <div class="row min-vh-100">

    <div class="col-lg-6 d-none d-lg-flex align-items-center justify-content-center bg-primary"></div>

    <div class="col-12 col-lg-6 d-flex align-items-center justify-content-center p-4">

      <div class="card border-0 shadow-sm w-100" style="max-width: 500px;">
        <div class="card-body p-4">

          <h1 class="h3 text-center fw-bold mb-2">Criar conta</h1>
          <p class="text-center text-secondary mb-4">Preencha os dados para criar sua conta</p>

          <div class="alert alert-danger" th:if="${erro}" th:text="${erro}"></div>

          <form th:action="@{/cadastro}" th:object="${colaborador}" method="post">

            <div class="mb-3">
              <label class="form-label">Nome</label>
              <input type="text" class="form-control" th:field="*{nome}" required>

              <div class="text-danger small mt-1" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></div>
            </div>

            <div class="mb-3">
              <label class="form-label">E-mail</label>
              <input type="email" class="form-control" th:field="*{email}" required>

              <div class="text-danger small mt-1" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
            </div>

            <div class="mb-3">
              <label class="form-label">Senha</label>
              <input type="password" class="form-control" th:field="*{senha}" required>

              <div class="text-danger small mt-1" th:if="${#fields.hasErrors('senha')}" th:errors="*{senha}">
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label">Matrícula</label>
              <input type="text" class="form-control" th:field="*{matricula}" required>

              <div class="text-danger small mt-1" th:if="${#fields.hasErrors('matricula')}" th:errors="*{matricula}"></div>
            </div>

            <div class="mb-4">
              <label class="form-label">Data de nascimento</label>
              <input type="date" class="form-control" th:field="*{dataNascimento}" required>

              <div class="text-danger small mt-1" th:if="${#fields.hasErrors('dataNascimento')}" th:errors="*{dataNascimento}">
              </div>
            </div>

            <button type="submit" class="btn btn-primary w-100">Criar conta</button>

          </form>

          <div class="text-center mt-4">
            <span class="text-secondary">Já possui uma conta?</span>
            <a th:href="@{/login}" class="text-decoration-none fw-semibold">Entrar</a>
          </div>

        </div>
      </div>

    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

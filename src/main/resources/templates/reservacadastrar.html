<!doctype html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadastro de Reserva</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg bg-primary" data-bs-theme="dark">
  <div class="container">
    <a class="navbar-brand" th:href="@{/home}">
      <img src="https://flaticons.net/icon.php?slug_category=people&slug_icon=user-group" alt="Logo" width="30" height="24" class="d-inline-block align-text-top mt-1 me-1"> Menu
    </a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal" aria-controls="menuPrincipal" aria-expanded="false" aria-label="Abrir menu">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="menuPrincipal">
      <ul class="navbar-nav ms-auto nav-underline">
        <li class="nav-item">
          <a class="nav-link text-light-emphasis" aria-current="page" th:href="@{/home}">Início</a>
        </li>
        <li class="nav-item">
          <a class="nav-link text-light-emphasis" th:href="@{/colaboradorlista}">Colaboradores</a>
        </li>
        <li class="nav-item">
          <a class="nav-link text-light-emphasis" th:href="@{/recursolista}">Recursos</a>
        </li>
        <li class="nav-item">
          <a class="nav-link active text-light-emphasis" th:href="@{/reservalista}">Reservas</a>
        </li>
        <li class="nav-item">
          <a class="nav-link text-light-emphasis" th:href="@{/login}">Sair</a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<main class="container py-4">
  <div class="row justify-content-center">
    <div class="col-12 col-lg-8">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
          <h1 class="h3 mb-1">Cadastrar reserva</h1>
          <p class="text-secondary mb-0">Preencha os dados para cadastrar uma nova reserva.</p>
        </div>
      </div>

      <div class="card shadow-sm">
        <div class="card-body">
          <div class="alert alert-danger" th:if="${erro}" th:text="${erro}"></div>

          <form th:action="@{/reservas}" th:object="${reserva}" method="post">
            <div class="mb-3">
              <label class="form-label">ID Colaborador</label><br><label>
              <input type="number" class="form-control" th:field="*{colaboradorId}" required>
            </label>

              <div class="text-danger small mt-1" th:if="${#fields.hasErrors('colaboradorId')}" th:errors="*{colaboradorId}"></div>
            </div>

            <div class="mb-3">
              <label class="form-label">ID Recurso</label><br><label>
              <input type="number" class="form-control" th:field="*{recursoId}" required>
            </label>

              <div class="text-danger small mt-1" th:if="${#fields.hasErrors('recursoId')}" th:errors="*{recursoId}"></div>
            </div>

            <div class="mb-3">
              <label class="form-label">Data</label><br><label>
                <input type="date" class="form-control" th:field="*{data}" required>
              </label>

              <div class="text-danger small mt-1" th:if="${#fields.hasErrors('data')}" th:errors="*{data}">
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label">Hora Inicial</label><br><label>
                <input type="time" class="form-control" th:field="*{horaInicial}" required>
              </label>

              <div class="text-danger small mt-1" th:if="${#fields.hasErrors('horaInicial')}" th:errors="*{horaInicial}"></div>
            </div>

            <div class="mb-3">
              <label class="form-label">Hora Final</label><br><label>
              <input type="time" class="form-control" th:field="*{horaFinal}" required>
            </label>

              <div class="text-danger small mt-1" th:if="${#fields.hasErrors('horaFinal')}" th:errors="*{horaFinal}"></div>
            </div>

            <div class="d-flex justify-content-end gap-2">
              <a class="btn btn-outline-secondary" th:href="@{/reservalista}">Cancelar</a>
              <button type="submit" class="btn btn-primary">Salvar</button>
            </div>

          </form>
        </div>
      </div>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

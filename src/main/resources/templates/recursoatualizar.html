<!doctype html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Atualizar Recrusos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg bg-primary" data-bs-theme="dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/home}">
            <img src="https://flaticons.net/icon.php?slug_category=people&slug_icon=user-group" alt="Logo" width="30" height="24" class="d-inline-block align-text-top mt-1 me-1"> Menu
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal" aria-controls="menuPrincipal" aria-expanded="false" aria-label="Abrir menu">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="menuPrincipal">
            <ul class="navbar-nav ms-auto nav-underline">
                <li class="nav-item">
                    <a class="nav-link text-light-emphasis" aria-current="page" th:href="@{/home}">Início</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-light-emphasis" th:href="@{/colaboradorlista}">Colaboradores</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-light-emphasis" th:href="@{/recursolista}">Recursos</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-light-emphasis" th:href="@{/reservalista}">Reservas</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-light-emphasis" th:href="@{/login}">Sair</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<main class="container py-4">
    <div class="row justify-content-center">
        <div class="col-12 col-lg-8">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h1 class="h3 mb-1">Cadastrar Recurso</h1>
                    <p class="text-secondary mb-0">Preencha os dados para cadastrar um novo recurso.</p>
                </div>
            </div>

            <div class="card shadow-sm">
                <div class="card-body">
                    <form th:action="@{/recursoatualizar}" th:object="${recurso}" method="post">
                        <input type="hidden" th:field="*{id}">

                        <div class="mb-3">
                            <label for="descricao" class="form-label">Nova Descrição</label>
                            <input type="text" class="form-control" id="descricao" th:field="*{descricao}" placeholder="Digite a descrição" required>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('descricao')}" th:errors="*{descricao}">
                                Erro na descrição
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="tipo" class="form-label">Novo Tipo</label>
                            <input type="text" class="form-control" id="tipo" th:field="*{tipo}" placeholder="Digite o tipo" required>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('tipo')}" th:errors="*{tipo}">
                                Erro no tipo
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Dias da Semana Disponível</label>

                            <div class="row">
                                <div class="col-md-2 form-check" th:each="dia : ${T(java.time.DayOfWeek).values()}">
                                    <input class="form-check-input" type="checkbox" th:field="*{diasDaSemanaDisponivel}" th:value="${dia}" th:id="${dia.name()}">

                                    <label class="form-check-label"
                                           th:for="${dia.name()}"
                                           th:text="${#strings.capitalize(#strings.toLowerCase(dia.name()))}">
                                    </label>
                                </div>
                            </div>

                            <div class="text-danger small mt-1"
                                 th:if="${#fields.hasErrors('diasDaSemanaDisponivel')}"
                                 th:errors="*{diasDaSemanaDisponivel}">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="dataInicial" class="form-label">Nova Data Inicial</label>
                            <input type="date" class="form-control" id="dataInicial" th:field="*{dataInicialAgendamento}">
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('dataInicialAgendamento')}" th:errors="*{dataInicialAgendamento}">
                                Erro na data inicial
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="dataFinalAgendamento" class="form-label">Nova Data Final</label>
                            <input type="date" class="form-control" id="dataFinalAgendamento" th:field="*{dataFinalAgendamento}">
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('dataFinalAgendamento')}" th:errors="*{dataFinalAgendamento}">
                                Erro na data final
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="horaInicialAgendamento" class="form-label">Novo Horário Inicial</label>
                            <input type="time" class="form-control" id="horaInicialAgendamento" th:field="*{horaInicialAgendamento}">
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('horaInicialAgendamento')}" th:errors="*{horaInicialAgendamento}">
                                Erro no horário inicial
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="horaFinalAgendamento" class="form-label">Novo Horário Final</label>
                            <input type="time" class="form-control" id="horaFinalAgendamento" th:field="*{horaFinalAgendamento}">
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('horaFinalAgendamento')}" th:errors="*{horaFinalAgendamento}">
                                Erro no horário final
                            </div>
                        </div>
                        <div class="d-flex justify-content-end gap-2">
                            <a class="btn btn-outline-secondary" th:href="@{/recursolista}">Cancelar</a>
                            <button type="submit" class="btn btn-primary">Salvar</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
